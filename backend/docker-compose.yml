services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit123
      POSTGRES_DB: orbit_db
    volumes:
      - orbit_pg_data:/var/lib/postgresql/data

volumes:
  orbit_pg_data:
